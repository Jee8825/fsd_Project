name: Build, scan & deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 — lint, build, scan. Runs for every push and PR.
  # ---------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ---------------------------------------------------------------------
  # Stage 2 — deploy React build to S3 + invalidate CloudFront.
  # ---------------------------------------------------------------------
  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ---------------------------------------------------------------------
  # Stage 3 — deploy Express backend to Elastic Beanstalk.
  # ---------------------------------------------------------------------
  deploy-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend deploy bundle
        run: |
          ZIP_NAME=backend-${{ github.sha }}.zip
          # Pack everything not listed in .ebignore.
          zip -r "$ZIP_NAME" . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "dist/*" \
            -x "src/App.jsx" -x "src/main.jsx" \
            -x "src/assets/*" -x "src/components/*" \
            -x "src/context/*" -x "src/hooks/*" \
            -x "src/pages/*" -x "src/styles/*" \
            -x "public/*" -x "index.html" -x "vite.config.js" \
            -x "mongo-data/*" -x "output/*" -x "tmp/*" \
            -x "scripts/*" -x "*.md" -x ".github/*" \
            -x ".claude/*" -x ".vscode/*" -x ".env" -x ".env.*"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload bundle to S3
        run: |
          aws s3 cp "$ZIP_NAME" \
            "s3://${{ secrets.EB_BUNDLE_BUCKET }}/${{ env.ZIP_NAME }}"

      - name: Create EB application version
        run: |
          # Skip if a version with this SHA already exists (e.g. from a prior failed run).
          EXISTS=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-labels "${{ github.sha }}" \
            --query 'length(ApplicationVersions)' --output text)
          if [ "$EXISTS" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "${{ secrets.EB_APP_NAME }}" \
              --version-label "${{ github.sha }}" \
              --source-bundle S3Bucket="${{ secrets.EB_BUNDLE_BUCKET }}",S3Key="${{ env.ZIP_NAME }}" \
              --auto-create-application
          else
            echo "Application version ${{ github.sha }} already exists; reusing it."
          fi

      - name: Update EB environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "${{ github.sha }}"

      - name: Wait for environment to be Ready
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-names "${{ secrets.EB_ENV_NAME }}"
          aws elasticbeanstalk describe-environments \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-names "${{ secrets.EB_ENV_NAME }}" \
            --query "Environments[0].{Status:Status,Health:Health,CNAME:CNAME}"
